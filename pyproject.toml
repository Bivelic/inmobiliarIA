[project]
name = "inmobiliaria"
version = "0.1.0"
description = "InmobiliarIA - Grupo 10 - plataforma de búsqueda inmobiliaria con IA"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scrapers"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
