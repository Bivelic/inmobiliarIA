# PostgreSQL 16 local para desarrollo.
# La primera vez que se levanta, ejecuta automáticamente db/01_schema.sql y db/02_comunas.sql.
# Para empezar de cero:  docker compose down -v  y luego  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: inmobiliaria-db
    environment:
      POSTGRES_USER: inmobiliaria
      POSTGRES_PASSWORD: inmobiliaria
      POSTGRES_DB: inmobiliaria
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inmobiliaria"]
      interval: 5s
      retries: 10

volumes:
  datos_pg:
