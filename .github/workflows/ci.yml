# Revisa cada push y pull request: estilo (ruff), pruebas (pytest) y build del frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inmobiliaria
          POSTGRES_PASSWORD: inmobiliaria
          POSTGRES_DB: inmobiliaria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inmobiliaria" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://inmobiliaria:inmobiliaria@localhost:5432/inmobiliaria
      VALOR_UF: "40000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python scripts/init_db.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
